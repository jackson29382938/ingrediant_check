<h1 style="font-size:15px;margin:0 0 10px">Lifecycle — does it stop working once it has an answer?</h1>
<pre id="out">running…</pre>

<script>
// Counts what main.js actually does, rather than what it is supposed to do. MutationObserver and
// extract() are both wrapped before main.js loads.
window.__stats = { observeCalls: 0, disconnectCalls: 0, connected: 0, extractCalls: 0 };
const RealMO = window.MutationObserver;
window.MutationObserver = function (cb) {
  const mo = new RealMO(cb);
  const obs = mo.observe.bind(mo), dis = mo.disconnect.bind(mo);
  mo.observe = (...a) => { window.__stats.observeCalls++; window.__stats.connected++; return obs(...a); };
  mo.disconnect = (...a) => { window.__stats.disconnectCalls++; window.__stats.connected--; return dis(...a); };
  return mo;
};
// Minimal chrome surface. Settings are whatever the query string says.
const params = new URLSearchParams(location.search);
const SETTINGS = { enabled: params.get('enabled') !== '0', badges: true, foodOnly: true,
  hoverScore: false, autoScoreSearch: false, ocrLabels: false, sendDiagnostics: false,
  useOpenFoodFacts: false, weights: {}, allergens: [], diets: [], avoidList: [] };
window.chrome = {
  runtime: { getManifest: () => ({ version: '0.9.0' }), sendMessage: (m, cb) => cb && cb(null),
             lastError: null, getURL: p => '/' + p },
  storage: { local: {
    get: (keys, cb) => { const out = {}; const list = keys === null ? Object.keys(SETTINGS)
        : (Array.isArray(keys) ? keys : [keys]);
      for (const k of list) if (k in SETTINGS) out[k] = SETTINGS[k]; cb && cb(out); },
    set: (o, cb) => { Object.assign(SETTINGS, o); cb && cb(); },
    remove: (k, cb) => cb && cb(),
  }, onChanged: { addListener: () => {} } },
  i18n: { getMessage: () => '' },
};
history.replaceState({}, '', '/dp/B00TESTTEST' + location.search);
</script>

<script>
// Build the page BEFORE main.js runs, then wrap extract to count.
const FOOD = params.get('kind') !== 'nonfood';
document.getElementById('productTitle').textContent = FOOD
  ? "Bob's Red Mill Organic Old Fashioned Rolled Oats, 32oz"
  : 'Head & Shoulders Classic Clean Anti-Dandruff Shampoo, 32.1 fl oz';
document.getElementById('wayfinding-breadcrumbs_feature_div').textContent = FOOD
  ? 'Grocery & Gourmet Food › Breakfast Cereal › Oatmeal'
  : 'Beauty & Personal Care › Hair Care › Shampoo';
document.getElementById('feature-bullets').innerHTML = FOOD
  ? '<ul><li><span>Organic whole grain rolled oats</span></li></ul>'
  : '<ul><li><span>For external use only</span></li></ul>';
document.getElementById('detailBullets_feature_div').innerHTML =
  '<ul><li><span>UPC ‏ : ‎ 039978049520</span></li><li><span>ASIN ‏ : ‎ B00TESTTEST</span></li></ul>';
document.getElementById('nic').innerHTML =
  '<div id="dietary-shopping-title"><span>Diet type</span></div>'
  + '<div id="nic-diet-type-logos-wrapper"><span> Kosher </span></div>'
  + '<div id="nic-nutrition-summary-serving"><span>19.0 servings per container | 0.5 cup</span></div>'
  + '<table><tbody><tr><td><span>180</span></td><td><span>0mg</span></td></tr>'
  + '<tr><td><span>Calories</span></td><td><span>Sodium</span></td></tr></tbody></table>'
  + '<h3>Ingredients</h3><div id="nic-ingredients-content"><span>'
  + (FOOD ? 'Organic Whole Grain Oats' : 'Water, Sodium Laureth Sulfate, Cocamidopropyl Betaine, Fragrance')
  + '</span></div>';
document.getElementById('page').style.display = '';

const realExtract = AIR.extract.extract;
AIR.extract.extract = function (...a) { window.__stats.extractCalls++; return realExtract.apply(this, a); };
</script>

<script src="/src/content/main.js"></script>

<script>
// Amazon mutates constantly: ad refresh, lazy images, carousels. This is a quiet version of a
// real product page. Results are written on every tick, because a backgrounded tab throttles
// timers and a run that only reports at the end may look hung when it is merely slow.
const out = document.getElementById('out');
const churn = document.getElementById('churn');
const MUTATIONS = 15;

function report(phase) {
  const s = window.__stats;
  const panel = document.getElementById('air-score-panel');
  window.__lifecycle = {
    phase,
    page: FOOD ? 'food (oats)' : 'non-food (shampoo)',
    masterEnabled: SETTINGS.enabled,
    panelState: panel ? panel.dataset.airState : '(no panel)',
    mutationsFired: churn.children.length,
    extractCalls: s.extractCalls,
    observerConnected: s.connected,
    observeCalls: s.observeCalls,
    disconnectCalls: s.disconnectCalls,
    badges: document.querySelectorAll('.air-badge').length,
  };
  out.textContent = JSON.stringify(window.__lifecycle, null, 2);
}

(async () => {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  report('settling');
  await wait(2000);
  report('settled, before churn');
  const before = window.__stats.extractCalls;
  for (let i = 0; i < MUTATIONS; i++) {
    churn.appendChild(document.createElement('span')).textContent = 'ad ' + i;
    await wait(150);
    report('churning ' + (i + 1) + '/' + MUTATIONS);
  }
  await wait(1200);
  report('done');
  window.__lifecycle.extractsDuringChurn = window.__stats.extractCalls - before;
  out.textContent = JSON.stringify(window.__lifecycle, null, 2);
})();
</script>
