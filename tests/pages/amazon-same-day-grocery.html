<!doctype html><html lang="en"><head><title>Amazon same-day groceries — synthetic layout regression</title><style>.aok-hidden{display:none}</style></head><body>
<!-- Synthetic: regression coverage, not a capture of the user's authenticated delivery area. -->
<!-- Cards 1 and 3 carry the add-to-cart control's hidden "Quantity not updated" heading AHEAD of the title, as a grocery tile's
     image control can: the badge and the side panel's name must come from the real title, not that heading. -->
<select id="searchDropdownBox"><option selected>Same-day Grocery</option></select>
<select id="s-result-sort-select"><option value="relevanceblender">Featured</option><option value="price-asc-rank">Price: Low to High</option></select>
<main id="search"><div class="s-main-slot">
<article data-asin="B000000001"><div class="puis-atcb-container"><button type="button" aria-label="Add to cart">+</button><div class="a-alert-inline aok-hidden"><h2 class="a-alert-heading">Quantity not updated</h2></div></div><a href="/dp/B000000001"><span class="a-size-base a-text-normal">Cottage cheese, 16 oz</span></a><span class="a-price"><span class="a-offscreen">$3.00</span></span></article>
<article data-asin="B000000002"><a href="/gp/product/B000000002"><span class="a-text-normal">Cottage cheese, 24 oz</span></a><span class="a-price"><span class="a-offscreen">$4.00</span></span></article>
<article data-asin="B000000003"><div class="puis-atcb-container"><button type="button" aria-label="Add to cart">+</button><div class="a-alert-inline aok-hidden"><h2 class="a-alert-heading">Quantity not updated</h2></div></div><h3><a href="/dp/B000000003">Low-fat cottage cheese, 16 oz</a></h3><span class="a-price"><span class="a-offscreen">$3.50</span></span></article>
</div></main></body></html>
