<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Ingredient Check — panel harness</title>
<style>
 body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;background:#eaeded;color:#0f1111}
 .bar{position:sticky;top:0;background:#232f3e;color:#fff;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:9}
 .bar b{margin-right:8px;font-size:13px}
 .bar button{background:#febd69;border:0;border-radius:6px;padding:6px 11px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
 .bar button:hover{background:#f3a847}
 .bar button[aria-pressed=true]{background:#fff;outline:2px solid #febd69}
 .page{max-width:820px;margin:16px auto;background:#fff;padding:18px 22px;border-radius:8px}
 #productTitle{font-size:22px;font-weight:400;margin:0 0 6px}
 .crumbs{font-size:12px;color:#565959;margin-bottom:14px}
 .nicDesktop{border:1px solid #d5d9d9;border-radius:8px;padding:14px;margin:16px 0}
 .nicDesktop h3{font-size:13px;margin:0 0 8px}
 table{border-collapse:collapse;margin:8px 0}
 td{padding:3px 12px;text-align:center}
 hr{border:0;border-top:1px solid #eaeded;margin:12px 0}
 #verdict{padding:8px 16px;font-size:12px;color:#565959}
</style></head><body>
<div class="bar">
  <b>Fixture</b>
  <button data-fx="oats" aria-pressed="true">Organic oats (clean)</button>
  <button data-fx="flakes">Frosted Flakes (junk)</button>
  <button data-fx="chips">Safflower chips (capped)</button>
  <button data-fx="beef">Grass-fed beef (provenance)</button>
  <button data-fx="shampoo">Shampoo (not food)</button>
  <button data-fx="unreadable">Japanese label (unreadable)</button>
  <button data-fx="spanish">Spanish label (scored)</button>
  <button data-fx="none">No ingredients (paste)</button>
</div>
<div class="page" id="dp-container">
  <h1 id="productTitle"></h1>
  <div class="crumbs" id="wayfinding-breadcrumbs_feature_div"></div>
  <div id="nutritionalInfoAndIngredients_feature_div"><div class="nicDesktop" id="nic"></div></div>
  <div id="feature-bullets"></div>
  <div id="detailBullets_feature_div"></div>
</div>
<div id="verdict"></div>

<script src="/src/engine/db/_module.js"></script>
<script src="/src/engine/db/oils.js"></script>
<script src="/src/engine/db/sugars.js"></script>
<script src="/src/engine/db/additives.js"></script>
<script src="/src/engine/db/labels.js"></script>
<script src="/src/engine/db/allergens.js"></script>
<script src="/src/engine/db/ingestible.js"></script>
<script src="/src/engine/db/provenance.js"></script>
<script src="/src/engine/categories.js"></script>
<script src="/src/engine/score.js"></script>
<script src="/src/engine/db/prefs.js"></script>
<script src="/src/engine/db/theme.js"></script>
<script src="/src/content/extract.js"></script>
<script src="/src/content/panel.js"></script>
<script src="/fixtures.js"></script>
</body></html>
