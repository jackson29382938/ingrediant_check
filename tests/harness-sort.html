<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sort harness</title>
<style>body{font:13px/1.5 -apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#f7f8f8}
.s-result-item{background:#fff;border:1px solid #d5d9d9;border-radius:8px;padding:8px 12px;margin:6px 0}</style></head><body>
<!-- Sort by score on an Amazon-shaped results page, with the real content scripts and a stub chrome.
     Scores are seeded in the stub cache; "Rate every search result" is off, so nothing is fetched.
     The harness records shadow roots so it can press the toolbar's buttons; the toolbar itself is
     unchanged. Driven by scripts/harness-ci.mjs. -->
<div id="search">
  <div class="s-main-slot s-result-list">
    <div data-component-type="s-search-result" data-asin="B0SORT0001" class="s-result-item"><h2><a href="/dp/B0SORT0001"><span>Oats with cane sugar</span></a></h2><span class="a-price"><span class="a-offscreen">$4.99</span></span></div>
    <div data-component-type="s-search-result" data-asin="B0SORT0002" class="s-result-item"><h2><a href="/dp/B0SORT0002"><span>Oats, never opened</span></a></h2><span class="a-price"><span class="a-offscreen">$3.49</span></span></div>
    <div data-component-type="s-search-result" data-asin="B0SORT0003" class="s-result-item"><h2><a href="/dp/B0SORT0003"><span>Organic rolled oats</span></a></h2><span class="a-price"><span class="a-offscreen">$6.29</span></span><div>1K+ bought in past month</div></div>
    <div data-component-type="s-search-result" data-asin="B0SORT0004" class="s-result-item"><h2><a href="/dp/B0SORT0004"><span>Instant oatmeal, maple</span></a></h2><span class="a-price"><span class="a-offscreen">$2.99</span></span></div>
    <div data-component-type="s-search-result" data-asin="B0SORT0005" class="s-result-item"><h2><a href="/dp/B0SORT0005"><span>Oat bar, never opened</span></a></h2></div>
    <div data-component-type="s-search-result" data-asin="B0SORT0006" class="s-result-item"><h2><a href="/dp/B0SORT0006"><span>Steel cut oats</span></a></h2><span class="a-price"><span class="a-offscreen">$5.49</span></span></div>
    <div data-component-type="s-search-result" data-asin="B0SORT0007" class="s-result-item"><h2><a href="/dp/B0SORT0007"><span>Oat milk, never opened</span></a></h2></div>
    <div data-component-type="s-search-result" data-asin="B0SORT0008" class="s-result-item"><h2><a href="/dp/B0SORT0008"><span>Oat flour</span></a></h2><span class="a-price"><span class="a-offscreen">$7.99</span></span></div>
  </div>
</div>
<script>
window.__shadows = [];
const realAttach = Element.prototype.attachShadow;
Element.prototype.attachShadow = function (init) {
  const shadow = realAttach.call(this, init);
  window.__shadows.push({ host: this, root: shadow });
  return shadow;
};
window.__messages = [];
const SETTINGS = { enabled: true, badges: true, foodOnly: true, hoverScore: false, autoScoreSearch: false,
  hoverBreakdown: false, ocrLabels: false, sendDiagnostics: false, useOpenFoodFacts: false, sharedCache: false,
  weights: {}, allergens: [], diets: [], avoidList: [], sortMissing: 'rate-first', sortLoadMore: false, sortCount: 100 };
window.__settings = SETTINGS;
window.chrome = {
  runtime: {
    getManifest: () => ({ version: '0.9.0' }), lastError: null, getURL: p => '/' + p,
    sendMessage: (m, cb) => {
      window.__messages.push(JSON.parse(JSON.stringify(m)));
      const reply = m.type === 'productsLookup' ? { rows: {} } : m.type === 'openSortedResults' ? { ok: true, count: m.results.length } : { ok: true };
      if (cb) setTimeout(() => cb(reply), 0);
    },
  },
  storage: { local: {
    get: (keys, cb) => {
      const list = keys === null ? Object.keys(SETTINGS) : (Array.isArray(keys) ? keys : [keys]);
      const out = {};
      for (const k of list) if (k in SETTINGS) out[k] = SETTINGS[k];
      if (cb) cb(out); return Promise.resolve(out);
    },
    set: (o, cb) => { Object.assign(SETTINGS, o); if (cb) cb(); return Promise.resolve(); },
    remove: (k, cb) => { if (cb) cb(); return Promise.resolve(); },
  }, onChanged: { addListener: () => {} } },
  i18n: { getMessage: () => '' },
};
history.replaceState({}, '', '/s?k=organic+oats');
</script>
<script src="/src/engine/db/_module.js"></script>
<script src="/src/engine/db/oils.js"></script>
<script src="/src/engine/db/sugars.js"></script>

<script src="/src/engine/db/product-cache.js"></script>
<script src="/src/engine/db/sorted-results.js"></script>
<script src="/src/engine/score.js"></script>
<script src="/src/content/extract.js"></script>

<script src="/src/content/product.js"></script>
<script src="/src/content/search.js"></script>
<script src="/src/content/hover-card.js"></script>
<script src="/src/content/sort.js"></script>
<script>
// Scores this computer already has, stored the way cacheScore() stores them.
const C = AIR.db.scoreCache;
const seed = { B0SORT0001: [40, 'Poor'], B0SORT0003: [90, 'Excellent'], B0SORT0004: [40, 'Poor'],
  B0SORT0006: [95, 'Excellent'], B0SORT0008: [72, 'Mediocre'] };
for (const [asin, [score, verdict]] of Object.entries(seed)) {
  SETTINGS[C.key(location.hostname, asin)] = {
    schema: C.SCHEMA, v: '0.9.0', t: Date.now() - 1000, store: C.normalizeStore(location.hostname), asin,
    prefs: C.fingerprint({ weights: {}, foodOnly: true }, 'page'), score, verdict, nova: 3, source: 'page',
    provenanceSource: '', name: asin,
  };
}
window.__order = () => [...document.querySelectorAll('.s-main-slot [data-asin]')].map(el => el.dataset.asin);
window.__toolbar = () => (window.__shadows.find(s => s.host.id === 'air-sort-host') || {}).root || null;
</script>
<script src="/src/content/main.js"></script>
</body></html>
