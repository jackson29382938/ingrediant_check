name: release

# Publishes a GitHub release with the store-ready zip attached and the notes from
# docs/releases/<version>.md. Either push a tag named after the manifest version (v1.2.0), or run
# it by hand from the Actions tab (Run workflow) on main: then the tag is created on that commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/test.yml
  release:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Version, tag and notes agree
        run: |
          version=$(node -p "require('./manifest.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest $version"; exit 1
          fi
          test -f "docs/releases/$version.md" || { echo "missing docs/releases/$version.md"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - run: npm run pack
      - run: npm install --no-save --no-package-lock web-ext@10.0.0
      - run: npm run firefox:lint
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" || {
              echo "existing release tag does not point to this commit"; exit 1;
            }
            gh release upload "$TAG" "dist/ingredient-check-$VERSION.zip" "dist/ingredient-check-$VERSION-firefox.zip" --clobber
            gh release edit "$TAG" --notes-file "docs/releases/$VERSION.md"
          else
            gh release create "$TAG" "dist/ingredient-check-$VERSION.zip" "dist/ingredient-check-$VERSION-firefox.zip" --target "$GITHUB_SHA" \
              --title "Ingredient Check $VERSION" --notes-file "docs/releases/$VERSION.md"
          fi
