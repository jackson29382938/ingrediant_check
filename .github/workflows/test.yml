name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No install step: the extension has no dependencies and no build, which is why the
      # sanity suite checks the wiring the manifest would otherwise be the only record of.
      - run: npm test
      - run: npm run preflight
