name: test

on:
  # Branch pushes are covered by their pull request; main runs on every push. Any branch can be run
  # by hand from the Actions tab (Run workflow), without opening a pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to the commit a release tag pointed to when it was reviewed, with the tag beside it. A tag
# such as v6 can be moved to different code by whoever controls the action's repository, and release.yml (which
# calls this file) runs with permission to write to this one. To update: `git ls-remote --tags
# https://github.com/actions/checkout 'refs/tags/v6*'`, read the release notes, change the commit and the comment
# in both workflow files. tests/workflow-pins.test.js fails on a tag or a branch.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # engines.node is >=20; 24 is the current LTS line the scoring audit was last validated on.
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
      # No install step: the extension and automated checks have no package dependencies.
      - run: npm test
      - run: npm run preflight
      # Both store packages build from this commit. The release workflow used to be the first place that ran, so a
      # packaging failure surfaced only after the tag had been pushed.
      - run: npm run pack

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      # `npm run lint` installs the pinned eslint, @eslint/js and globals (package.json) for this job only
      # and fails on any warning.
      - run: npm run lint

  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      # Playwright is CI-only and pinned, so the browser it downloads matches. The extension itself
      # stays dependency-free.
      - run: npm install --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run harness:ci
      # Walmart and Target through the real extension: search from the home page, ads hidden, sorting by price per unit.
      - run: npm run retailers:check
      - run: npm run website:check
      - name: Check deployed website when configured
        if: ${{ vars.WEBSITE_URL != '' }}
        run: npm run website:check -- --url "$IC_WEBSITE_URL"
        env:
          IC_WEBSITE_URL: ${{ vars.WEBSITE_URL }}

  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock web-ext@10.0.0
      - run: npm run pack:firefox
      - run: npm run firefox:lint
      - run: npm run firefox:setup
        env:
          IC_FIREFOX_TOOLS: /tmp/ingredient-check-firefox-tools
      - run: npm run harness:firefox
        env:
          FIREFOX_BINARY: /tmp/ingredient-check-firefox-tools/firefox/firefox
          GECKODRIVER: /tmp/ingredient-check-firefox-tools/geckodriver
